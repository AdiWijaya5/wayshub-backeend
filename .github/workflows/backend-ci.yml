name: Backend CI/CD to Docker Hub

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env file from GitHub Secrets
        run: |
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run Docker Compose (Test Stage)
        run: docker compose up -d

      - name: Run Backend Tests
        run: docker compose exec -T backend npm test

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/wayshub-backend:latest

      - name: Down Docker Compose
        if: always()
        run: docker compose down

      - name: Send Discord Notification (Success)
        if: success()
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: info
          details: "Sukses! Pipeline CI/CD berjalan lancar dan image baru berhasil di-push ke Docker Hub."
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send Discord Notification (Failure)
        if: failure()
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: error
          details: "Gagal! Pipeline CI/CD mengalami error pada proses test atau build."
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}
