name: CI/CD Backend to AWS EC2

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env file from GitHub Secrets
        run: |
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run Docker Compose (Test Stage)
        run: docker compose up -d

      - name: Run Backend Tests
        run: docker compose exec -T backend npm test

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/wayshub-backend:latest

      - name: Down Docker Compose (Local Runner Cleanup)
        if: always()
        run: docker compose down

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/adi/docker/wayshub-backend
            git pull origin main
            docker compose pull
            docker compose up -d --force-recreate
            docker system prune -f

      - name: Send Discord Notification (Success)
        if: success()
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: info
          details: "Sukses! Aplikasi backend wayshub berhasil di-deploy otomatis ke AWS EC2 dan domain https://api.adiwijaya.studentdumbways.my.id."
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send Discord Notification (Failure)
        if: failure()
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: error
          details: "Gagal! Pipeline CI/CD mengalami kendala pada tahap test, build, atau deployment ke EC2."
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}
